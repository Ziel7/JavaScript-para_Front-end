<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Exercício: Filtro de Produtos Avançado</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f1f1f1;
        padding: 40px;
        text-align: center;
      }

      .container {
        max-width: 500px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
        text-align: left;
      }

      li {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        transition: all 0.3s ease;
      }

      li.hidden {
        display: none;
      }

      li.highlight {
        background-color: #d2f8da;
        border-left: 5px solid #4caf50;
      }

      #contador {
        margin-top: 10px;
        font-weight: bold;
        color: #333;
      }

      #mensagem-erro {
        display: none;
        margin-top: 20px;
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Buscar Produtos</h2>
      <input type="text" id="campoBusca" placeholder="Digite para buscar..." />

      <p id="contador"></p>
      <p id="mensagem-erro">Nenhum produto encontrado.</p>

      <ul id="listaProdutos">
        <li>Notebook</li>
        <li>Smartphone</li>
        <li>Fone de Ouvido</li>
        <li>Carregador</li>
        <li>Mouse</li>
        <li>Teclado</li>
        <li>Monitor</li>
      </ul>
    </div>

    <script>
        const campoBusca = document.getElementById("campoBusca");
const contador = document.getElementById("contador");
const mensagemErro = document.getElementById("mensagem-erro");
const itens = document.querySelectorAll("#listaProdutos li");

function filtrarProdutos() {
  const termo = campoBusca.value.trim().toLowerCase();

  // Campo vazio: mostra tudo, remove destaques e esconde mensagem e contador
  if (termo === "") {
    itens.forEach((li) => li.classList.remove("hidden", "highlight"));
    contador.textContent = "";
    mensagemErro.style.display = "none";
    return;
  }

  let encontrados = 0;

  itens.forEach((li) => {
    const nome = li.textContent.toLowerCase();

    if (nome.includes(termo)) {
      li.classList.remove("hidden");
      li.classList.add("highlight");
      encontrados++;
    } else {
      li.classList.add("hidden");
      li.classList.remove("highlight");
    }
  });

  if (encontrados === 0) {
    contador.textContent = "";
    mensagemErro.style.display = "block";
  } else {
    contador.textContent = `${encontrados} resultado(s) encontrado(s)`;
    mensagemErro.style.display = "none";
  }
}

campoBusca.addEventListener("keyup", filtrarProdutos);
    </script>
  </body>
</html>
