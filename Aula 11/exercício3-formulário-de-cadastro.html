<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Exercício: Cadastro de Produtos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      padding: 40px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input, select, textarea {
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #mensagemErro {
      color: red;
      margin-bottom: 10px;
    }

    .produto {
      margin-top: 20px;
      text-align: left;
      background-color: #e3f2fd;
      padding: 15px;
      border-radius: 5px;
    }

    .produto + .produto {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cadastro de Produtos</h2>

    <form id="formProduto">
      <input type="text" id="nome" placeholder="Nome do produto" required />
      <input type="number" id="preco" placeholder="Preço (R$)" required />
      <select id="categoria" required>
        <option value="">Selecione a categoria</option>
        <option>Eletrônicos</option>
        <option>Livros</option>
        <option>Roupas</option>
        <option>Outros</option>
      </select>
      <textarea id="descricao" placeholder="Descrição do produto" rows="3"></textarea>
      <div id="mensagemErro"></div>
      <button type="submit">Cadastrar</button>
    </form>

    <div id="listaProdutos"></div>
  </div>

  <script>
    const form = document.getElementById("formProduto");
const mensagemErro = document.getElementById("mensagemErro");
const listaProdutos = document.getElementById("listaProdutos");

// Desativa a validação nativa do navegador para que nossas mensagens apareçam
form.setAttribute("novalidate", "");

form.addEventListener("submit", function (event) {
  event.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const preco = parseFloat(document.getElementById("preco").value);
  const categoria = document.getElementById("categoria").value;
  const descricao = document.getElementById("descricao").value.trim();

  // Validação
  const erros = [];

  if (nome.length < 3) {
    erros.push("O nome deve ter no mínimo 3 caracteres.");
  }
  if (isNaN(preco) || preco <= 0) {
    erros.push("O preço deve ser um número positivo.");
  }
  if (categoria === "") {
    erros.push("Selecione uma categoria.");
  }

  if (erros.length > 0) {
    mensagemErro.innerHTML = erros.join("<br>");
    return;
  }

  mensagemErro.textContent = "";

  // Criação dinâmica do bloco do produto
  const bloco = document.createElement("div");
  bloco.classList.add("produto");

  const linhas = [
    nome,
    `Preço: R$ ${preco.toFixed(2)}`,
    `Categoria: ${categoria}`,
    `Descrição: ${descricao || "Sem descrição"}`,
    `Cadastrado em: ${new Date().toLocaleString("pt-BR")}`,
  ];

  linhas.forEach((texto, i) => {
    const p = document.createElement("p");
    p.textContent = texto;
    if (i === 0) p.style.fontWeight = "bold";
    bloco.appendChild(p);
  });

  listaProdutos.appendChild(bloco);

  form.reset();
});
  </script>
</body>
</html>
